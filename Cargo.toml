[workspace]
resolver = "2"
members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/FarhanAliRaza/reflex-desktop"

[workspace.dependencies]
reflex-desktop-core = { path = "crates/core" }
mxc-sdk = "1.0.0"
agent-client-protocol = { version = "3.2.0", features = ["process"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"

[profile.release]
lto = "thin"
codegen-units = 1

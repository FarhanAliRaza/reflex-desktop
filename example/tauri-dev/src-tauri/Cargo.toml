[package]
name = "reflex-counter"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# >>> reflex-desktop plugins >>>
tauri-plugin-notification = "2"
# <<< reflex-desktop plugins <<<
notify-rust = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[[bin]]
name = "reflex-counter"
path = "src/main.rs"
